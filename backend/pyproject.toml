[project]
name = "bankverse"
version = "0.1.0"
description = "BANKVERSE AI — Intelligent Banking & Financial Intelligence Platform (backend, data & AI engines)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "BANKVERSE AI" }]
dependencies = [
  # --- API & platform
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "pyotp>=2.9",
  "segno>=1.6",
  "python-multipart>=0.0.9",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "tenacity>=9.0",
  "orjson>=3.10",
  "redis>=5.0",
  "boto3>=1.35",
  # --- data engineering
  "polars>=1.6",
  "pandas>=2.2",
  "pyarrow>=17",
  "duckdb>=1.1",
  "xlrd>=2.0",
  "pyspark>=3.5",
  # --- ML / DL
  "numpy>=1.26,<2.3",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "shap>=0.46",
  "statsmodels>=0.14.2",
  "networkx>=3.3",
  "torch>=2.4",
  "torch-geometric>=2.6",
  "optuna>=4.0",
  "mlflow-skinny>=2.16",
  "joblib>=1.4",
  # --- documents
  "pymupdf>=1.24",
  "opencv-python-headless>=4.10",
  "pytesseract>=0.3.13",
  "pillow>=10.4",
  "reportlab>=4.2",
  "filetype>=1.2",
  # --- NLP / RAG / agents
  "rank-bm25>=0.2.2",
  "langgraph>=0.2.30",
  "langchain-core>=0.3",
  "anthropic>=0.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
bankverse = "bankverse.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankverse"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = [
  "S101",   # assert in tests
  "B008",   # FastAPI Depends in defaults
  "RUF001", "RUF002", "RUF003",  # French typography in strings/comments
  "N803", "N806",  # ML conventions (X, X_train)
  "S311",   # non-crypto randomness is intentional for simulations (seeded)
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "N"]
"src/bankverse/migrations/**" = ["E501", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires a running PostgreSQL (BANKVERSE_DATABASE_URL)",
  "slow: long-running (training, large data)",
  "models: requires trained model artifacts",
]
timeout = 600

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
