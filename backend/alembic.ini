# Two independent migration streams:
#   control : schemas "control" + "platform" (shared platform database only)
#   tenant  : schema "bank" (shared database, or each dedicated bank database)
# Usage: alembic -n control upgrade head ; alembic -n tenant upgrade head
#        alembic -n tenant -x db_url=postgresql+psycopg://... upgrade head   (dedicated DB)

[control]
script_location = %(here)s/src/bankverse/migrations/control
version_locations = %(here)s/src/bankverse/migrations/control/versions
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[tenant]
script_location = %(here)s/src/bankverse/migrations/tenant
version_locations = %(here)s/src/bankverse/migrations/tenant/versions
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
